name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # Robolectric's Android 36 sandbox does not run on 17.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Verify and build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --configuration-cache
      - name: Export minified APK for startup check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minified-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  startup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Download minified APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minified-apk
          path: startup-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch minified app
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            trap 'adb logcat -d -v threadtime "*:E" | tail -300' ERR
            apk="$(find startup-apk -type f -name '*.apk' -print -quit)"
            test -n "$apk"
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/startup-check.jks" \
              -storepass startup-check -keypass startup-check \
              -alias startup-check -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=Autobile startup check"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/startup-check.jks" \
              --ks-pass pass:startup-check \
              --key-pass pass:startup-check \
              "$apk"
            adb install "$apk"
            adb logcat -c
            launch="$(adb shell am start -W -n com.autobile/com.autobile.app.MainActivity)"
            printf '%s\n' "$launch"
            grep -Fq 'Status: ok' <<< "$launch"
            sleep 3
            test -n "$(adb shell pidof com.autobile)"
            adb shell dumpsys activity activities | grep -F 'mResumedActivity' | grep -F 'com.autobile'

  verify:
    if: always()
    needs: [build, startup]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          STARTUP_RESULT: ${{ needs.startup.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$STARTUP_RESULT" = success
